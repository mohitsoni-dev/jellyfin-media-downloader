{% extends "base.html" %}
{% block title %}Create account · Local Auth{% endblock %}
{% block content %}
<div class="form-wrap">
  <p class="eyebrow">A fresh start</p>
  <h2>Create account</h2>
  <p class="form-lead">Make a little room for yourself.</p>
  {% if error %}<p class="notice" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/register" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" required maxlength="254" value="{{ email or '' }}" placeholder="you@example.com">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
    <p class="field-hint">Use at least 8 characters.</p>
    <button class="primary-button" type="submit">Create account <span aria-hidden="true">→</span></button>
  </form>
  <p class="switch-copy">Already have an account? <a href="/login">Sign in</a></p>
</div>
{% endblock %}
